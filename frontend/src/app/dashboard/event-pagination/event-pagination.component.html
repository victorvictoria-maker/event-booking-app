<div class="d-flex justify-content-between align-items-center mt-4" *ngIf="paginationData.totalPages > 1">
    <div class="text-muted">
        Showing {{ getFromEntry() }} to {{ getToEntry() }} of {{ paginationData.totalItems }} entries
    </div>

    <nav [attr.aria-label]="ariaLabel">
        <ul class="pagination mb-0">
            <li class="page-item" [class.disabled]="!paginationData.hasPrevPage">
                <button class="page-link" (click)="onPreviousPage()" [disabled]="!paginationData.hasPrevPage">
                    <i class="fas fa-chevron-left"></i>
                    Previous
                </button>
            </li>

            <li class="page-item" *ngIf="paginationData.currentPage > 3 && paginationData.totalPages > 5">
                <button class="page-link" (click)="onPageChange(1)">1</button>
            </li>

            <li class="page-item disabled" *ngIf="paginationData.currentPage > 4 && paginationData.totalPages > 6">
                <span class="page-link">...</span>
            </li>

            <li class="page-item" *ngFor="let page of getPageNumbers(); trackBy: trackByPageNumber"
                [class.active]="page === paginationData.currentPage">
                <button class="page-link" (click)="onPageChange(page)">
                    {{ page }}
                </button>
            </li>

            <li class="page-item disabled"
                *ngIf="paginationData.currentPage < paginationData.totalPages - 3 && paginationData.totalPages > 6">
                <span class="page-link">...</span>
            </li>

            <li class="page-item"
                *ngIf="paginationData.currentPage < paginationData.totalPages - 2 && paginationData.totalPages > 5">
                <button class="page-link" (click)="onPageChange(paginationData.totalPages)">{{ paginationData.totalPages
                    }}</button>
            </li>

            <li class="page-item" [class.disabled]="!paginationData.hasNextPage">
                <button class="page-link" (click)="onNextPage()" [disabled]="!paginationData.hasNextPage">
                    Next
                    <i class="fas fa-chevron-right"></i>
                </button>
            </li>
        </ul>
    </nav>
</div>
