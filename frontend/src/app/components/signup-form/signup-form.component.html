<div class="text-center mb-4">
    <h2 class="fw-bold fs-2 fs-lg-4 fs-sm-5 mb-2 textSecondary">{{ title }}</h2>
    <p class="textGray fs-6 mb-4">Create your account</p>
</div>

<form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
    <div class="form-group mb-3">
        <label for="username" class="smallFont textSecondary fw-semibold mb-2">Username</label>
        <input type="text" id="username" class="form-control"
            [class.is-invalid]="f['username'].invalid && f['username'].touched" formControlName="username"
            placeholder="Enter your username" />
        <div class="invalid-feedback" *ngIf="f['username'].invalid && f['username'].touched">
            Username is required.
        </div>
    </div>

    <div class="form-group mb-3">
        <label for="email" class="smallFont textSecondary fw-semibold mb-2">Email</label>
        <input type="email" id="email" class="form-control"
            [class.is-invalid]="f['email'].invalid && f['email'].touched" formControlName="email"
            placeholder="Enter your email" />
        <div class="invalid-feedback" *ngIf="f['email'].invalid && f['email'].touched">
            Valid email is required.
        </div>
    </div>

    <div class="form-group mb-3">
        <label for="password" class="smallFont textSecondary fw-semibold mb-2">Password</label>
        <div class="password-input-wrapper">
            <input [type]="showPassword() ? 'text' : 'password'" id="password" class="form-control"
                [class.is-invalid]="f['password'].invalid && f['password'].touched" formControlName="password"
                placeholder="Enter your password" />
            <button type="button" class="password-toggle-btn" (click)="togglePasswordVisibility()">
                <i [class]="showPassword() ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
        </div>
        <div class="invalid-feedback" *ngIf="f['password'].invalid && f['password'].touched">
            Password is required (min 6 chars).
        </div>
    </div>

    <div class="form-group mb-4">
        <label for="confirmPassword" class="smallFont textSecondary fw-semibold mb-2">Confirm Password</label>
        <div class="password-input-wrapper">
            <input [type]="showConfirmPassword() ? 'text' : 'password'" id="confirmPassword" class="form-control"
                [class.is-invalid]="(f['confirmPassword'].touched && (f['confirmPassword'].invalid || signupForm.errors?.['notMatching']))"
                formControlName="confirmPassword" placeholder="Confirm your password" />
            <button type="button" class="password-toggle-btn" (click)="toggleConfirmPasswordVisibility()">
                <i [class]="showConfirmPassword() ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
        </div>
        <div class="invalid-feedback" *ngIf="f['confirmPassword'].touched">
            <ng-container *ngIf="f['confirmPassword'].hasError('required')">
                Confirm password is required.
            </ng-container>
            <ng-container *ngIf="!f['confirmPassword'].hasError('required') && signupForm.errors?.['notMatching']">
                Passwords must match.
            </ng-container>
        </div>
    </div>


    <input type="hidden" [value]="isAdmin ? 'admin' : 'user'" />

    <button type="submit" class="btn w-100 auth-submit-btn" [disabled]="isLoading()">
        <span *ngIf="isLoading()" class="spinner-border spinner-border-sm me-2" role="status"></span>
        {{ isLoading() ? 'Registering...' : 'Sign Up' }}
    </button>
</form>
