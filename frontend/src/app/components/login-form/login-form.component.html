<div class="text-center mb-4">
    <h2 class="fw-bold fs-2 fs-lg-4 fs-sm-5 mb-2 textSecondary">{{title}}</h2>
    <p class="textGray fs-6 mb-4">Sign in to your account</p>
</div>

<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group mb-3">
        <label for="usernameOrEmail" class="textSecondary fw-semibold mb-2 smallFont">Username or Email</label>
        <input type="text" id="usernameOrEmail" class="form-control"
            [class.is-invalid]="f['usernameOrEmail'].invalid && f['usernameOrEmail'].touched"
            formControlName="usernameOrEmail" placeholder="Enter your username or email" />
        <div class="invalid-feedback" *ngIf="f['usernameOrEmail'].invalid && f['usernameOrEmail'].touched">
            Username or email is required.
        </div>
    </div>


    <div class="form-group mb-3">
        <label for="password" class="textSecondary fw-semibold mb-2 smallFont">Password</label>
        <div class="password-input-wrapper">
            <input [type]="showPassword() ? 'text' : 'password'" id="password" class="form-control"
                [class.is-invalid]="f['password'].invalid && f['password'].touched" formControlName="password"
                placeholder="Enter your password" />
            <button type="button" class="password-toggle-btn" (click)="togglePasswordVisibility()">
                <i [class]="showPassword() ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
        </div>
        <div class="invalid-feedback" *ngIf="f['password'].invalid && f['password'].touched">
            Password is required.
        </div>
    </div>

    <!-- <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label" for="rememberMe">
                Remember me
            </label>
        </div>
        <a class="forgot-password-link">Forgot Password?</a>
    </div> -->

    <input type="hidden" [value]="isAdmin ? 'admin' : 'user'" />

    <button type="submit" class="btn w-100 auth-submit-btn" [disabled]="isLoading()">
        <span *ngIf="isLoading()" class="spinner-border spinner-border-sm me-2" role="status"></span>
        {{ isLoading() ? 'Signing In...' : 'Sign In' }}
    </button>
</form>
